<script>
document.getElementById('year').textContent = new Date().getFullYear();

(function(){
  const AZKAR = [
    // ===== أذكار من القرآن =====
    { id:'ilm', category:'quran', title:'دعاء طلب العلم', text:'رَبِّ زِدْنِي عِلْمًا', ref:'القرآن الكريم: سورة طه، الآية 114', target:1 },
    { id:'hidaya', category:'quran', title:'دعاء الهداية والثبات', text:'رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِنْ لَدُنْكَ رَحْمَةً إِنَّكَ أَنْتَ الْوَهَّابُ', ref:'سورة آل عمران، الآية 8', target:1 },
    { id:'hasana', category:'quran', title:'دعاء الحسنة في الدنيا والآخرة', text:'رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ', ref:'سورة البقرة، الآية 201', target:1 },
    { id:'sabr', category:'quran', title:'دعاء الصبر والثبات', text:'يَا أَيُّهَا الَّذِينَ آمَنُوا اسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ ۚ إِنَّ اللَّهَ مَعَ الصَّابِرِينَ', ref:'سورة البقرة، الآية 153', target:1 },
    { id:'tawakkul', category:'quran', title:'دعاء التوكل', text:'حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ', ref:'سورة آل عمران، الآية 173', target:1 },
    { id:'afw', category:'quran', title:'دعاء العفو', text:'رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ', ref:'سورة الأعراف، الآية 23', target:1 },

    // ===== أذكار الصباح والمساء =====
    { id:'istighfar', category:'morning', title:'سيد الاستغفار', text:'اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ.', ref:'صحيح البخاري، حديث 6306', target:3 },
    { id:'subhan100', category:'morning', title:'ذكر عظيم الأجر', text:'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ', ref:'صحيح البخاري (6405) وصحيح مسلم (2691) — مئة مرة', target:100 },
    { id:'afiya', category:'morning', title:'دعاء العافية', text:'اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ', ref:'سنن أبي داود، حديث 5090', target:3 },
    { id:'kifaya', category:'morning', title:'دعاء الكفاية', text:'بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ', ref:'سنن أبي داود، حديث 5088', target:3 },
    { id:'rida', category:'morning', title:'دعاء الرضا', text:'رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا', ref:'سنن أبي داود، حديث 5072', target:3 },
    { id:'afw_afiya', category:'morning', title:'دعاء العفو والعافية', text:'اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ...', ref:'سنن ابن ماجه، حديث 3871', target:1 },

    // ===== أذكار بعد الصلاة =====
    { id:'tasbih33', category:'prayer', title:'التسبيح بعد الصلاة', text:'سُبْحَانَ اللَّهِ (33 مرة)', ref:'صحيح مسلم، حديث 597', target:33 },
    { id:'tahmid33', category:'prayer', title:'التحميد بعد الصلاة', text:'الْحَمْدُ لِلَّهِ (33 مرة)', ref:'صحيح مسلم، حديث 597', target:33 },
    { id:'takbir33', category:'prayer', title:'التكبير بعد الصلاة', text:'اللَّهُ أَكْبَرُ (33 مرة)', ref:'صحيح مسلم، حديث 597', target:33 },
    { id:'tahlil', category:'prayer', title:'التهليل بعد الصلاة', text:'لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ', ref:'صحيح مسلم، حديث 597', target:1 },

    // ===== أذكار يومية =====
    { id:'istiana', category:'daily', title:'دعاء الاستعانة', text:'اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ', ref:'سنن أبي داود، حديث 1522', target:1 },
    { id:'karb', category:'daily', title:'دعاء الكرب', text:'لَا إِلَهَ إِلَّا اللَّهُ الْعَظِيمُ الْحَلِيمُ، لَا إِلَهَ إِلَّا اللَّهُ رَبُّ الْعَرْشِ الْعَظِيمِ، لَا إِلَهَ إِلَّا اللَّهُ رَبُّ السَّمَاوَاتِ وَرَبُّ الْأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيمِ', ref:'صحيح البخاري (6346)، صحيح مسلم (2730)', target:1 },
    { id:'huda', category:'daily', title:'دعاء نافع', text:'اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالتُّقَى وَالْعَفَافَ وَالْغِنَى', ref:'صحيح مسلم، حديث 2721', target:1 },
    { id:'hawla', category:'daily', title:'ذكر جامع', text:'لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ', ref:'صحيح البخاري (6384)، صحيح مسلم (2694)', target:1 },
    { id:'salat', category:'daily', title:'الصلاة على النبي ﷺ', text:'اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ', ref:'صيغة دعاء بالصلاة والسلام', target:10 },
    { id:'hasbi', category:'daily', title:'دعاء الكفاية', text:'حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ', ref:'سنن أبي داود', target:7 },

    // ===== أذكار عامة (جديدة) =====
    { id:'general1', category:'general', title:'دعاء دخول المسجد', text:'اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ', ref:'صحيح مسلم', target:1 },
    { id:'general2', category:'general', title:'دعاء الخروج من المسجد', text:'اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ', ref:'صحيح مسلم', target:1 },
    { id:'general3', category:'general', title:'دعاء دخول الخلاء', text:'اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ', ref:'صحيح البخاري ومسلم', target:1 },
    { id:'general4', category:'general', title:'دعاء الخروج من الخلاء', text:'غُفْرَانَكَ', ref:'سنن أبي داود والترمذي', target:1 },
    { id:'general5', category:'general', title:'دعاء السفر', text:'سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ، وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ', ref:'صحيح مسلم', target:1 },
    { id:'general6', category:'general', title:'دعاء الطعام', text:'بِسْمِ اللَّهِ', ref:'متفق عليه', target:1 },
    { id:'general7', category:'general', title:'دعاء بعد الطعام', text:'الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنَا وَسَقَانَا وَجَعَلَنَا مُسْلِمِينَ', ref:'سنن أبي داود والترمذي', target:1 },
    { id:'general8', category:'general', title:'دعاء لبس الثوب', text:'الْحَمْدُ لِلَّهِ الَّذِي كَسَانِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ', ref:'سنن أبي داود والترمذي', target:1 },
    { id:'general9', category:'general', title:'دعاء الاستخارة', text:'اللَّهُمَّ إِنِّي أَسْتَخِيرُكَ بِعِلْمِكَ، وَأَسْتَقْدِرُكَ بِقُدْرَتِكَ...', ref:'صحيح البخاري', target:1 },
    { id:'general10', category:'general', title:'دعاء القنوت', text:'اللَّهُمَّ اهْدِنِي فِيمَنْ هَدَيْتَ، وَعَافِنِي فِيمَنْ عَافَيْتَ...', ref:'سنن الترمذي', target:1 },
    { id:'general11', category:'general', title:'دعاء الهم والحزن', text:'اللَّهُمَّ إِنِّي عَبْدُكَ، ابْنُ عَبْدِكَ، ابْنُ أَمَتِكَ...', ref:'رواه أحمد', target:1 },
    { id:'general12', category:'general', title:'دعاء الاستغفار', text:'أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ', ref:'صحيح البخاري ومسلم', target:100 },
    { id:'general13', category:'general', title:'دعاء الرزق', text:'اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ، وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ', ref:'سنن الترمذي', target:1 },
    { id:'general14', category:'general', title:'دعاء الشفاء', text:'أَسْأَلُ اللَّهَ الْعَظِيمَ رَبَّ الْعَرْشِ الْعَظِيمِ أَنْ يَشْفِيَكَ', ref:'سنن أبي داود والترمذي', target:7 },
    { id:'general15', category:'general', title:'دعاء دخول المنزل', text:'بِسْمِ اللَّهِ وَلَجْنَا، وَبِسْمِ اللَّهِ خَرَجْنَا، وَعَلَى اللَّهِ رَبِّنَا تَوَكَّلْنَا', ref:'سنن أبي داود', target:1 },
  ];

  const KEY = 'zad_counts_v2';
  function loadC(){ try { return JSON.parse(localStorage.getItem(KEY)||'{}'); } catch { return {}; } }
  function saveC(c){ try { localStorage.setItem(KEY, JSON.stringify(c)); } catch {} }
  const counts = loadC();

  const container = document.getElementById('azkarList');
  if(!container) return;

  AZKAR.forEach(z => {
    const card = document.createElement('article');
    card.className = 'azkar-item';
    card.id = 'dhikr-' + z.id;
    card.dataset.category = z.category;

    const h3 = document.createElement('h3');
    h3.textContent = z.title;

    const text = document.createElement('div');
    text.className = 'azkar-text';
    text.textContent = z.text;

    const ref = document.createElement('div');
    ref.className = 'azkar-ref';
    ref.textContent = z.ref;

    const actions = document.createElement('div');
    actions.className = 'azkar-actions';

    const bCopy = document.createElement('button');
    bCopy.type='button'; bCopy.className='action-btn'; bCopy.textContent='📋 نسخ';
    const bSpeak = document.createElement('button');
    bSpeak.type='button'; bSpeak.className='action-btn'; bSpeak.textContent='🔊 استماع';
    const bShare = document.createElement('button');
    bShare.type='button'; bShare.className='action-btn'; bShare.textContent='📤 مشاركة';
    const bCount = document.createElement('button');
    bCount.type='button'; bCount.className='action-btn primary'; bCount.textContent='+ عدّ';
    const badge = document.createElement('span');
    badge.className='count-badge'; badge.textContent = (counts[z.id]||0) + ' / ' + z.target;
    const bReset = document.createElement('button');
    bReset.type='button'; bReset.className='action-btn'; bReset.textContent='إعادة';

    actions.append(bCopy, bSpeak, bShare, bCount, badge, bReset);
    card.append(h3, text, ref, actions);
    container.appendChild(card);

    bCopy.addEventListener('click', async ()=>{ try { await copyText(z.text); showToast('تم النسخ ✓'); } catch { showToast('تعذّر النسخ'); } });
    bSpeak.addEventListener('click', ()=> speak(z.text));
    bShare.addEventListener('click', ()=> shareContent({ title: z.title, text: z.text, url: location.origin + '/adhkar.html#dhikr-' + z.id }));
    bCount.addEventListener('click', ()=>{
      const cur = counts[z.id] || 0;
      if(cur >= z.target) return;
      counts[z.id] = cur + 1; saveC(counts);
      badge.textContent = counts[z.id] + ' / ' + z.target;
      if(counts[z.id] >= z.target){ badge.style.background = 'var(--primary)'; badge.style.color = '#fff'; showToast('اكتمل ✓'); }
    });
    bReset.addEventListener('click', ()=>{
      delete counts[z.id]; saveC(counts);
      badge.textContent = '0 / ' + z.target;
      badge.style.background = 'var(--accent-light)';
      badge.style.color = 'var(--primary)';
    });
  });

  // الفلترة
  document.querySelectorAll('#dhikrFilters .filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#dhikrFilters .filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const f = btn.dataset.filter;
      document.querySelectorAll('.azkar-item').forEach(card => {
        card.style.display = (f === 'all' || card.dataset.category === f) ? '' : 'none';
      });
    });
  });

  // البحث
  const search = document.getElementById('azkarSearch');
  if(search){
    search.addEventListener('input', () => {
      const q = search.value.trim().toLowerCase();
      document.querySelectorAll('.azkar-item').forEach(card => {
        const txt = card.textContent.toLowerCase();
        card.style.display = (!q || txt.includes(q)) ? '' : 'none';
      });
    });
  }
})();
</script>
</body>
</html>
