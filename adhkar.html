  document.getElementById('azkarSub').textContent = 'أذكار وأدعية من القرآن والسنة الصحيحة — ' + AZKAR.length + ' ذكرًا مع نصوصها ومصادرها';

  function norm(s){
    return String(s || '')
      .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g, '')
      .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
      .toLowerCase().replace(/\s+/g, ' ').trim();
  }

  const KEY = 'zad_counts_v3';
  function loadC(){ try { return JSON.parse(localStorage.getItem(KEY)||'{}'); } catch (e) { return {}; } }
  function saveC(c){ try { localStorage.setItem(KEY, JSON.stringify(c)); } catch (e) {} }
  const counts = loadC();

  const container = document.getElementById('azkarList');
  if(!container) return;

  AZKAR.forEach(z => {
    const card = document.createElement('article');
    card.className = 'azkar-item';
    card.id = 'dhikr-' + z.id;
    card.dataset.category = z.category;

    const h3 = document.createElement('h3');
    h3.textContent = z.title;

    const text = document.createElement('div');
    text.className = 'azkar-text';
    text.textContent = z.text;

    const ref = document.createElement('div');
    ref.className = 'azkar-ref';
    ref.textContent = z.ref;

    const actions = document.createElement('div');
    actions.className = 'azkar-actions';

    const bCopy = document.createElement('button');
    bCopy.type='button'; bCopy.className='action-btn'; bCopy.textContent='📋 نسخ';
    const bSpeak = document.createElement('button');
    bSpeak.type='button'; bSpeak.className='action-btn'; bSpeak.textContent='🔊 استماع';
    const bShare = document.createElement('button');
    bShare.type='button'; bShare.className='action-btn'; bShare.textContent='📤 مشاركة';
    const bCount = document.createElement('button');
    bCount.type='button'; bCount.className='action-btn primary'; bCount.textContent='+ عدّ';
    const badge = document.createElement('span');
    badge.className='count-badge'; badge.textContent = (counts[z.id]||0) + ' / ' + z.target;
    const bReset = document.createElement('button');
    bReset.type='button'; bReset.className='action-btn'; bReset.textContent='إعادة';

    actions.append(bCopy, bSpeak, bShare, bCount, badge, bReset);
    card.append(h3, text, ref, actions);
    container.appendChild(card);

    if ((counts[z.id]||0) >= z.target) { badge.style.background = 'var(--primary)'; badge.style.color = '#fff'; }

    bCopy.addEventListener('click', async ()=>{ try { await copyText(z.text); showToast('تم النسخ ✓'); } catch (e) { showToast('تعذّر النسخ'); } });
    bSpeak.addEventListener('click', ()=> speak(z.text));
    bShare.addEventListener('click', ()=> shareContent({ title: z.title, text: z.text, url: location.origin + location.pathname + '#dhikr-' + z.id }));
    bCount.addEventListener('click', ()=>{
      const cur = counts[z.id] || 0;
      if(cur >= z.target) return;
      counts[z.id] = cur + 1; saveC(counts);
      badge.textContent = counts[z.id] + ' / ' + z.target;
      if(counts[z.id] >= z.target){ badge.style.background = 'var(--primary)'; badge.style.color = '#fff'; showToast('اكتمل ✓'); }
    });
    bReset.addEventListener('click', ()=>{
      delete counts[z.id]; saveC(counts);
      badge.textContent = '0 / ' + z.target;
      badge.style.background = 'var(--accent-light)';
      badge.style.color = 'var(--primary)';
    });
  });

  // الفلترة والبحث معًا
  let activeFilter = 'all';
  const search = document.getElementById('azkarSearch');
  const keys = new Map();
  document.querySelectorAll('.azkar-item').forEach(c => keys.set(c, norm(c.textContent)));

  function apply(){
    const q = norm(search ? search.value : '');
    document.querySelectorAll('.azkar-item').forEach(card => {
      const okCat = activeFilter === 'all' || card.dataset.category === activeFilter;
      const okQ = !q || keys.get(card).includes(q);
      card.style.display = (okCat && okQ) ? '' : 'none';
    });
  }
  document.querySelectorAll('#dhikrFilters .filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#dhikrFilters .filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      apply();
    });
  });
  if (search) search.addEventListener('input', apply);

  // الانتقال إلى ذكر محدد من الرابط
  if (/^#dhikr-/.test(location.hash)) {
    const t = document.getElementById(location.hash.slice(1));
    if (t) setTimeout(() => t.scrollIntoView({ block: 'center' }), 100);
  }
})();
</script>
