  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/style.css">
  <style>
    .azkar-container { max-width: 800px; margin: 0 auto; }
    .azkar-card {
      background: var(--card); border-radius: var(--radius); padding: 24px;
      box-shadow: var(--shadow); border: 1px solid var(--line); margin-bottom: 20px;
    }
    .azkar-item {
      padding: 14px 0; border-bottom: 1px solid var(--line);
    }
    .azkar-item:last-child { border-bottom: none; }
    .azkar-text {
      font-size: 1.15rem; line-height: 2.2; color: var(--text); margin-bottom: 8px;
      background: var(--primary-light); padding: 12px 16px; border-radius: 8px;
      border-right: 3px solid var(--accent);
      white-space: pre-line;
    }
    .azkar-ref { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
    .azkar-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .azkar-actions button {
      padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line);
      background: var(--bg); color: var(--primary); font-size: 0.8rem; cursor: pointer;
      font-family: inherit;
    }
    .azkar-actions button:hover { background: var(--primary); color: #fff; }
    .count-badge { padding: 6px 12px; background: var(--accent-light); color: var(--primary); border-radius: 6px; font-weight: bold; font-size: 0.85rem; }
  </style>
</head>

      <div><h4>روابط</h4><p><a href="./index.html">الرئيسية</a><br><a href="./adhkar.html">الأذكار</a><br><a href="./wird.html">وردك اليومي</a></p></div>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

(function(){
  const AZKAR_MORNING = [
    { id:'m1', title:'آية الكرسي', text:'اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ', ref:'البقرة 255 — من قرأها حين يصبح أُجير من الجن حتى يمسي (الحاكم)', target:1 },
    { id:'m2', title:'المعوذتان والإخلاص', text:'قُلْ هُوَ اللَّهُ أَحَدٌ... (ثلاث مرات)', ref:'ثلاث مرات — من قالها حين يصبح وحين يمسي كفته من كل شيء (أبو داود والترمذي)', target:3 },
    { id:'m3', title:'سيد الاستغفار', text:'اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ.', ref:'صحيح البخاري، حديث 6306 — من قالها موقناً بها حين يصبح فمات من يومه دخل الجنة', target:1 },
    { id:'m4', title:'دعاء العافية', text:'اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ', ref:'سنن أبي داود، حديث 5090', target:3 },
    { id:'m5', title:'دعاء الكفاية', text:'بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ', ref:'سنن أبي داود، حديث 5088 — من قالها ثلاثاً لم يضره شيء', target:3 },
    { id:'m6', title:'دعاء الرضا', text:'رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا', ref:'سنن أبي داود، حديث 5072', target:3 },
    { id:'m7', title:'دعاء العفو والعافية', text:'اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي', ref:'سنن ابن ماجه، حديث 3871', target:1 },
    { id:'m8', title:'دعاء الثبات', text:'يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ', ref:'سنن النسائي، حديث 1028', target:1 },
    { id:'m9', title:'التسبيح والتحميد', text:'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ', ref:'صحيح مسلم، حديث 2691 — مئة مرة', target:100 },
    { id:'m10', title:'التوحيد', text:'لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ', ref:'صحيح البخاري، حديث 3293 — عشر مرات', target:10 },
    { id:'m11', title:'دعاء الحفظ', text:'اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْبُخْلِ وَالْجُبْنِ، وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ', ref:'صحيح البخاري', target:1 },
    { id:'m12', title:'دعاء البركة', text:'اللَّهُمَّ بَارِكْ لَنَا فِيمَا رَزَقْتَنَا، وَقِنَا عَذَابَ النَّارِ', ref:'سنن ابن ماجه', target:1 },
    { id:'m13', title:'دعاء الهداية', text:'اللَّهُمَّ اهْدِنِي فِيمَنْ هَدَيْتَ، وَعَافِنِي فِيمَنْ عَافَيْتَ، وَتَوَلَّنِي فِيمَنْ تَوَلَّيْتَ، وَبَارِكْ لِي فِيمَا أَعْطَيْتَ، وَقِنِي شَرَّ مَا قَضَيْتَ', ref:'سنن الترمذي', target:1 },
    { id:'m14', title:'دعاء النور', text:'اللَّهُمَّ اجْعَلْ فِي قَلْبِي نُورًا، وَفِي بَصَرِي نُورًا، وَفِي سَمْعِي نُورًا، وَعَنْ يَمِينِي نُورًا، وَعَنْ شِمَالِي نُورًا، وَفَوْقِي نُورًا، وَتَحْتِي نُورًا، وَأَمَامِي نُورًا، وَخَلْفِي نُورًا', ref:'متفق عليه', target:1 },
    { id:'m15', title:'دعاء المغفرة', text:'رَبِّ اغْفِرْ لِي وَتُبْ عَلَيَّ، إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ', ref:'سنن أبي داود والترمذي', target:3 },
    { id:'m16', title:'دعاء السلامة', text:'اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ', ref:'سنن ابن ماجه', target:1 },
    { id:'m17', title:'دعاء اليقين', text:'اللَّهُمَّ إِنِّي أَسْأَلُكَ الْيَقِينَ فِي الْإِيمَانِ، وَالْعَافِيَةَ فِي الْأَبْدَانِ، وَالْأَمَانَةَ فِي الْقُلُوبِ', ref:'رواه الطبراني', target:1 },
    { id:'m18', title:'دعاء الحفظ من الشيطان', text:'أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ', ref:'من قالها حين يصبح لم يقربه الشيطان', target:3 },
    { id:'m19', title:'الصلاة على النبي', text:'اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ', ref:'من صلى علي صلاة صلى الله عليه بها عشراً (مسلم)', target:10 },
    { id:'m20', title:'دعاء البر', text:'اللَّهُمَّ إِنِّي أَسْأَلُكَ الْبِرَّ وَالتَّقْوَى، وَالْعَفَافَ وَالْغِنَى', ref:'صحيح مسلم', target:1 },
    { id:'m21', title:'دعاء الخير كله', text:'اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنَ الْخَيْرِ كُلِّهِ عَاجِلِهِ وَآجِلِهِ، مَا عَلِمْتُ مِنْهُ وَمَا لَمْ أَعْلَمْ', ref:'رواه أحمد', target:1 },
    { id:'m22', title:'دعاء الشكر', text:'اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ', ref:'سنن أبي داود والنسائي', target:1 },
    { id:'m23', title:'دعاء العفو', text:'اللَّهُمَّ إِنَّكَ عَفُوٌّ كَرِيمٌ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي', ref:'سنن الترمذي', target:1 },
    { id:'m24', title:'دعاء القنوت', text:'اللَّهُمَّ اهْدِنِي فِيمَنْ هَدَيْتَ، وَعَافِنِي فِيمَنْ عَافَيْتَ، وَتَوَلَّنِي فِيمَنْ تَوَلَّيْتَ', ref:'سنن الترمذي', target:1 },
    { id:'m25', title:'دعاء الاستعاذة', text:'أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ', ref:'صحيح مسلم — ثلاث مرات', target:3 },
  ];

  const KEY = 'zad_counts_morning_v2';
  function loadC(){ try { return JSON.parse(localStorage.getItem(KEY)||'{}'); } catch { return {}; } }
  function saveC(c){ try { localStorage.setItem(KEY, JSON.stringify(c)); } catch {} }
  const counts = loadC();

  const container = document.getElementById('azkarList');
  if(!container) return;

  AZKAR_MORNING.forEach(z => {
    const item = document.createElement('div');
    item.className = 'azkar-item';
    item.id = 'dhikr-' + z.id;

    const h3 = document.createElement('h3');
    h3.textContent = z.title;

    const text = document.createElement('div');
    text.className = 'azkar-text';
    text.textContent = z.text;

    const ref = document.createElement('div');
    ref.className = 'azkar-ref';
    ref.textContent = z.ref;

    const actions = document.createElement('div');
    actions.className = 'azkar-actions';

    const bCopy = document.createElement('button');
    bCopy.type='button'; bCopy.textContent='📋 نسخ';
    const bSpeak = document.createElement('button');
    bSpeak.type='button'; bSpeak.textContent='🔊 استماع';
    const bShare = document.createElement('button');
    bShare.type='button'; bShare.textContent='📤 مشاركة';
    const bCount = document.createElement('button');
    bCount.type='button'; bCount.textContent='+ عدّ';
    const badge = document.createElement('span');
    badge.className='count-badge'; badge.textContent = (counts[z.id]||0) + ' / ' + z.target;
    const bReset = document.createElement('button');
    bReset.type='button'; bReset.textContent='إعادة';

    actions.append(bCopy, bSpeak, bShare, bCount, badge, bReset);
    item.append(h3, text, ref, actions);
    container.appendChild(item);

    bCopy.addEventListener('click', async ()=>{ try { await copyText(z.text); showToast('تم النسخ ✓'); } catch { showToast('تعذّر النسخ'); } });
    bSpeak.addEventListener('click', ()=> speak(z.text));
    bShare.addEventListener('click', ()=> shareContent({ title: z.title, text: z.text, url: location.origin + '/azkar-morning.html#dhikr-' + z.id }));
    bCount.addEventListener('click', ()=>{
      const cur = counts[z.id] || 0;
      if(cur >= z.target) return;
      counts[z.id] = cur + 1; saveC(counts);
      badge.textContent = counts[z.id] + ' / ' + z.target;
      if(counts[z.id] >= z.target){ badge.style.background = 'var(--primary)'; badge.style.color = '#fff'; showToast('اكتمل ✓'); }
    });
    bReset.addEventListener('click', ()=>{
      delete counts[z.id]; saveC(counts);
      badge.textContent = '0 / ' + z.target;
      badge.style.background = 'var(--accent-light)';
      badge.style.color = 'var(--primary)';
    });
  });

  // البحث
  const search = document.getElementById('azkarSearch');
  if(search){
    search.addEventListener('input', () => {
      const q = search.value.trim().toLowerCase();
      document.querySelectorAll('.azkar-item').forEach(item => {
        const txt = item.textContent.toLowerCase();
        item.style.display = (!q || txt.includes(q)) ? '' : 'none';
      });
    });
  }
})();
</script>
</body>
</html>
