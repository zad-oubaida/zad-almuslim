<script>
document.getElementById('year').textContent = new Date().getFullYear();

(function(){
  const AZKAR_SLEEP = [
    { id:'s1', title:'آية الكرسي', text:'اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ', ref:'البقرة 255 — من قرأها إذا أوى إلى فراشه لم يزل عليه من الله حافظ ولا يقربه شيطان حتى يصبح (رواه البخاري)', target:1 },
    { id:'s2', title:'آخر آيتين من سورة البقرة', text:'آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ ۚ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ ۚ وَقَالُوا سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ ۝ لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ۚ أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ', ref:'البقرة 285-286 — «من قرأ بالآيتين من آخر سورة البقرة في ليلة كفتاه» (متفق عليه)', target:1 },
    { id:'s3', title:'الإخلاص والمعوذتان (يجمع كفّيه وينفث فيهما)', text:'قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ\n\nقُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِن شَرِّ مَا خَلَقَ ۝ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ\n\nقُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ', ref:'كان النبي ﷺ إذا أوى إلى فراشه كل ليلة جمع كفّيه ثم نفث فيهما وقرأ هذه السور، ثم مسح بهما ما استطاع من جسده يبدأ برأسه ووجهه وما أقبل من جسده، يفعل ذلك ثلاث مرات (رواه البخاري)', target:3 },
    { id:'s4', title:'سورة الكافرون', text:'قُلْ يَا أَيُّهَا الْكَافِرُونَ ۝ لَا أَعْبُدُ مَا تَعْبُدُونَ ۝ وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ ۝ وَلَا أَنَا عَابِدٌ مَّا عَبَدتُّمْ ۝ وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ ۝ لَكُمْ دِينُكُمْ وَلِيَ دِينِ', ref:'«اقرأ ﴿قل يا أيها الكافرون﴾ ثم نم على خاتمتها فإنها براءة من الشرك» (رواه أبو داود والترمذي، وصححه الألباني)', target:1 },
    { id:'s5', title:'سورتا السجدة والملك', text:'يُقرأ سورة ﴿الم تَنزِيلُ﴾ (السجدة) وسورة ﴿تَبَارَكَ الَّذِي بِيَدِهِ الْمُلْكُ﴾ (الملك)', ref:'كان النبي ﷺ لا ينام حتى يقرأ ﴿الم تنزيل﴾ و﴿تبارك الذي بيده الملك﴾ (رواه الترمذي والنسائي، وصححه الألباني)', target:1 },
    { id:'s6', title:'التسبيح والتحميد والتكبير', text:'سُبْحَانَ اللَّهِ (33)\nالْحَمْدُ لِلَّهِ (33)\nاللَّهُ أَكْبَرُ (34)', ref:'قال النبي ﷺ لعلي وفاطمة رضي الله عنهما: «ألا أدلكما على خير مما سألتماني؟ إذا أخذتما مضاجعكما…» فذكره (متفق عليه)', target:1 },
    { id:'s7', title:'دعاء الاضطجاع على الشق الأيمن', text:'اللَّهُمَّ أَسْلَمْتُ نَفْسِي إِلَيْكَ، وَفَوَّضْتُ أَمْرِي إِلَيْكَ، وَوَجَّهْتُ وَجْهِي إِلَيْكَ، وَأَلْجَأْتُ ظَهْرِي إِلَيْكَ، رَغْبَةً وَرَهْبَةً إِلَيْكَ، لَا مَلْجَأَ وَلَا مَنْجَا مِنْكَ إِلَّا إِلَيْكَ، آمَنْتُ بِكِتَابِكَ الَّذِي أَنْزَلْتَ، وَبِنَبِيِّكَ الَّذِي أَرْسَلْتَ', ref:'«إذا أتيت مضجعك فتوضأ وضوءك للصلاة ثم اضطجع على شقك الأيمن… فإن مت من ليلتك مت على الفطرة، واجعلهن آخر ما تتكلم به» (متفق عليه)', target:1 },
    { id:'s8', title:'باسمك ربي وضعت جنبي', text:'بِاسْمِكَ رَبِّي وَضَعْتُ جَنْبِي، وَبِكَ أَرْفَعُهُ، فَإِنْ أَمْسَكْتَ نَفْسِي فَارْحَمْهَا، وَإِنْ أَرْسَلْتَهَا فَاحْفَظْهَا بِمَا تَحْفَظُ بِهِ عِبَادَكَ الصَّالِحِينَ', ref:'متفق عليه (من حديث أبي هريرة رضي الله عنه)', target:1 },
    { id:'s9', title:'دعاء النوم', text:'اللَّهُمَّ بِاسْمِكَ أَمُوتُ وَأَحْيَا', ref:'رواه البخاري (من حديث حذيفة رضي الله عنه)', target:1 },
    { id:'s10', title:'اللهم قني عذابك', text:'اللَّهُمَّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ', ref:'كان النبي ﷺ إذا أراد أن يرقد وضع يده اليمنى تحت خده ثم قال ذلك ثلاث مرات (رواه أبو داود، وصححه الألباني)', target:3 },
    { id:'s11', title:'اللهم خلقت نفسي وأنت توفاها', text:'اللَّهُمَّ خَلَقْتَ نَفْسِي وَأَنْتَ تَوَفَّاهَا، لَكَ مَمَاتُهَا وَمَحْيَاهَا، إِنْ أَحْيَيْتَهَا فَاحْفَظْهَا، وَإِنْ أَمَتَّهَا فَاغْفِرْ لَهَا، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَافِيَةَ', ref:'رواه مسلم (من حديث ابن عمر رضي الله عنهما)', target:1 },
    { id:'s12', title:'اللهم رب السماوات السبع', text:'اللَّهُمَّ رَبَّ السَّمَاوَاتِ السَّبْعِ وَرَبَّ الْعَرْشِ الْعَظِيمِ، رَبَّنَا وَرَبَّ كُلِّ شَيْءٍ، فَالِقَ الْحَبِّ وَالنَّوَى، وَمُنْزِلَ التَّوْرَاةِ وَالْإِنْجِيلِ وَالْفُرْقَانِ، أَعُوذُ بِكَ مِنْ شَرِّ كُلِّ شَيْءٍ أَنْتَ آخِذٌ بِنَاصِيَتِهِ، اللَّهُمَّ أَنْتَ الْأَوَّلُ فَلَيْسَ قَبْلَكَ شَيْءٌ، وَأَنْتَ الْآخِرُ فَلَيْسَ بَعْدَكَ شَيْءٌ، وَأَنْتَ الظَّاهِرُ فَلَيْسَ فَوْقَكَ شَيْءٌ، وَأَنْتَ الْبَاطِنُ فَلَيْسَ دُونَكَ شَيْءٌ، اقْضِ عَنَّا الدَّيْنَ وَأَغْنِنَا مِنَ الْفَقْرِ', ref:'رواه مسلم (من حديث أبي هريرة رضي الله عنه)', target:1 },
    { id:'s13', title:'اللهم عالم الغيب والشهادة', text:'اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ', ref:'أمر به النبي ﷺ أبا بكر رضي الله عنه: «قله إذا أصبحت وإذا أمسيت وإذا أخذت مضجعك» (رواه أبو داود والترمذي، وصححه الألباني)', target:1 },
    { id:'s14', title:'الحمد لله الذي أطعمنا وسقانا', text:'الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنَا وَسَقَانَا وَكَفَانَا وَآوَانَا، فَكَمْ مِمَّنْ لَا كَافِيَ لَهُ وَلَا مُؤْوِيَ', ref:'رواه مسلم (من حديث أنس رضي الله عنه)', target:1 },
    { id:'s16', title:'الحمد لله الذي كفاني وآواني', text:'الْحَمْدُ لِلَّهِ الَّذِي كَفَانِي وَآوَانِي، وَأَطْعَمَنِي وَسَقَانِي، وَالَّذِي مَنَّ عَلَيَّ فَأَفْضَلَ، وَالَّذِي أَعْطَانِي فَأَجْزَلَ، الْحَمْدُ لِلَّهِ عَلَى كُلِّ حَالٍ، اللَّهُمَّ رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ وَإِلَهَ كُلِّ شَيْءٍ، أَعُوذُ بِكَ مِنَ النَّارِ', ref:'كان النبي ﷺ إذا أوى إلى فراشه قال ذلك (رواه أبو داود، وصححه الألباني)', target:1 },
    { id:'s17', title:'آداب النوم من السنة', text:'١- الوضوء قبل النوم، والاضطجاع على الشق الأيمن.\n٢- نفض الفراش بداخلة الإزار قبل الاضطجاع، ثم قول: «باسمك ربي وضعت جنبي…».\n٣- إغلاق الأبواب وإطفاء المصابيح مع ذكر اسم الله.', ref:'«إذا أتيت مضجعك فتوضأ…» (متفق عليه). «إذا أوى أحدكم إلى فراشه فلينفض فراشه بداخلة إزاره…» (متفق عليه). «أغلقوا الأبواب وأطفئوا المصابيح…» (رواه البخاري ومسلم)', target:1 },
    { id:'s15', title:'دعاء الاستيقاظ من النوم', text:'الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ', ref:'رواه البخاري (من حديث حذيفة رضي الله عنه)', target:1 },
    { id:'s18', title:'الحمد لله الذي عافاني في جسدي', text:'الْحَمْدُ لِلَّهِ الَّذِي عَافَانِي فِي جَسَدِي، وَرَدَّ عَلَيَّ رُوحِي، وَأَذِنَ لِي بِذِكْرِهِ', ref:'رواه الترمذي، وحسّنه الألباني (من أذكار الاستيقاظ)', target:1 },
    { id:'s19', title:'من استيقظ من الليل', text:'لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، الْحَمْدُ لِلَّهِ، وَسُبْحَانَ اللَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ — ثم يقول: اللَّهُمَّ اغْفِرْ لِي، أو يدعو', ref:'«من تعارّ من الليل فقال… ثم قال: اللهم اغفر لي أو دعا استُجيب له، فإن توضأ وصلى قُبلت صلاته» (رواه البخاري)', target:1 },
    { id:'s20', title:'إذا تقلّب الإنسان ليلاً', text:'لَا إِلَهَ إِلَّا اللَّهُ الْوَاحِدُ الْقَهَّارُ، رَبُّ السَّمَاوَاتِ وَالْأَرْضِ وَمَا بَيْنَهُمَا الْعَزِيزُ الْغَفَّارُ', ref:'رواه النسائي في عمل اليوم والليلة وابن حبان والحاكم، وصححه الألباني', target:1 },
    { id:'s21', title:'إذا فزع في نومه', text:'أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ غَضَبِهِ وَعِقَابِهِ، وَشَرِّ عِبَادِهِ، وَمِنْ هَمَزَاتِ الشَّيَاطِينِ وَأَنْ يَحْضُرُونِ', ref:'«إذا فزع أحدكم في النوم فليقل… فإنها لن تضره» (رواه أبو داود والترمذي، وحسّنه الألباني)', target:1 },
    { id:'s22', title:'إذا رأى في منامه ما يكره', text:'يَنْفُثُ عَنْ يَسَارِهِ ثَلَاثًا، وَيَقُولُ: أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ وَمِنْ شَرِّ مَا رَأَيْتُ (ثَلَاثًا)، وَلَا يُحَدِّثُ بِهَا أَحَدًا، وَيَتَحَوَّلُ عَنْ جَنْبِهِ الَّذِي كَانَ عَلَيْهِ', ref:'«الرؤيا الصالحة من الله، والحُلم من الشيطان…» (رواه البخاري ومسلم)', target:1 },
  ];

  const KEY = 'zad_counts_sleep_v3';
  function loadC(){ try { return JSON.parse(localStorage.getItem(KEY)||'{}'); } catch { return {}; } }
  function saveC(c){ try { localStorage.setItem(KEY, JSON.stringify(c)); } catch {} }
  const counts = loadC();

  const container = document.getElementById('azkarList');
  if(!container) return;

  AZKAR_SLEEP.forEach(z => {
    const item = document.createElement('div');
    item.className = 'azkar-item';
    item.id = 'dhikr-' + z.id;

    const h3 = document.createElement('h3');
    h3.textContent = z.title;

    const text = document.createElement('div');
    text.className = 'azkar-text';
    text.textContent = z.text;

    const ref = document.createElement('div');
    ref.className = 'azkar-ref';
    ref.textContent = z.ref;

    const actions = document.createElement('div');
    actions.className = 'azkar-actions';

    const bCopy = document.createElement('button');
    bCopy.type='button'; bCopy.textContent='📋 نسخ';
    const bSpeak = document.createElement('button');
    bSpeak.type='button'; bSpeak.textContent='🔊 استماع';
    const bShare = document.createElement('button');
    bShare.type='button'; bShare.textContent='📤 مشاركة';
    const bCount = document.createElement('button');
    bCount.type='button'; bCount.textContent='+ عدّ';
    const badge = document.createElement('span');
    badge.className='count-badge'; badge.textContent = (counts[z.id]||0) + ' / ' + z.target;
    const bReset = document.createElement('button');
    bReset.type='button'; bReset.textContent='إعادة';

    actions.append(bCopy, bSpeak, bShare, bCount, badge, bReset);
    item.append(h3, text, ref, actions);
    container.appendChild(item);

    if((counts[z.id]||0) >= z.target){ badge.style.background = 'var(--primary)'; badge.style.color = '#fff'; }

    bCopy.addEventListener('click', async ()=>{ try { await copyText(z.text); showToast('تم النسخ ✓'); } catch { showToast('تعذّر النسخ'); } });
    bSpeak.addEventListener('click', ()=> speak(z.text));
    bShare.addEventListener('click', ()=> shareContent({ title: z.title, text: z.text, url: location.origin + '/azkar-sleep.html#dhikr-' + z.id }));
    bCount.addEventListener('click', ()=>{
      const cur = counts[z.id] || 0;
      if(cur >= z.target) return;
      counts[z.id] = cur + 1; saveC(counts);
      badge.textContent = counts[z.id] + ' / ' + z.target;
      if(counts[z.id] >= z.target){ badge.style.background = 'var(--primary)'; badge.style.color = '#fff'; showToast('اكتمل ✓'); }
    });
    bReset.addEventListener('click', ()=>{
      delete counts[z.id]; saveC(counts);
      badge.textContent = '0 / ' + z.target;
      badge.style.background = 'var(--accent-light)';
      badge.style.color = 'var(--primary)';
    });
  });

  // البحث
  const search = document.getElementById('azkarSearch');
  if(search){
    search.addEventListener('input', () => {
      const q = search.value.trim().toLowerCase();
      document.querySelectorAll('.azkar-item').forEach(item => {
        const txt = item.textContent.toLowerCase();
        item.style.display = (!q || txt.includes(q)) ? '' : 'none';
      });
    });
  }
})();
</script>
</body>
</html>
