  <style>
    .azkar-container { max-width: 800px; margin: 0 auto; }
    .azkar-card {
      background: var(--card); border-radius: var(--radius); padding: 24px;
      box-shadow: var(--shadow); border: 1px solid var(--line); margin-bottom: 20px;
    }
    .azkar-item {
      padding: 14px 0; border-bottom: 1px solid var(--line);
    }
    .azkar-item:last-child { border-bottom: none; }
    .azkar-text {
      font-size: 1.15rem; line-height: 2.2; color: var(--text); margin-bottom: 8px;
      background: var(--primary-light); padding: 12px 16px; border-radius: 8px;
      border-right: 3px solid var(--accent);
    }
    .azkar-ref { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
    .azkar-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .azkar-actions button {
      padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line);
      background: var(--bg); color: var(--primary); font-size: 0.8rem; cursor: pointer;
      font-family: inherit;
    }
    .azkar-actions button:hover { background: var(--primary); color: #fff; }
    .count-badge { padding: 6px 12px; background: var(--accent-light); color: var(--primary); border-radius: 6px; font-weight: bold; font-size: 0.85rem; }
  </style>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

(function(){
  const AZKAR_SLEEP = [
    { id:'sleep1', title:'آية الكرسي', text:'اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ', ref:'البقرة 255 — من قرأها عند نومه لم يزل عليه من الله حافظ، ولا يقربه شيطان حتى يصبح (البخاري)', target:1 },
    { id:'sleep2', title:'المعوذتان والإخلاص', text:'قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ ۝ قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِن شَرِّ مَا خَلَقَ ۝ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ ۝ قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ', ref:'ثلاث مرات — كان النبي ﷺ يقرأها عند نومه (البخاري)', target:3 },
    { id:'sleep3', title:'تسبيح فاطمة', text:'سُبْحَانَ اللَّهِ (33) — الْحَمْدُ لِلَّهِ (33) — اللَّهُ أَكْبَرُ (34)', ref:'متفق عليه — قال النبي ﷺ: "خير لك من خادم"', target:1 },
    { id:'sleep4', title:'دعاء النوم', text:'بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا', ref:'رواه البخاري', target:1 },
    { id:'sleep5', title:'آخر آيتين من البقرة', text:'آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ ۚ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ ۚ وَقَالُوا سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ...', ref:'البقرة 285-286 — من قرأهما في ليلة كفتاه (متفق عليه)', target:1 },
    { id:'sleep6', title:'دعاء الاستعاذة', text:'أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ', ref:'رواه مسلم — من قالها عند نومه لم تضره حية', target:3 },
    { id:'sleep7', title:'دعاء التوبة', text:'أَسْتَغْفِرُ اللَّهَ الَّذِي لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ وَأَتُوبُ إِلَيْهِ', ref:'رواه أبو داود والترمذي', target:3 },
    { id:'sleep8', title:'دعاء الحفظ', text:'اللَّهُمَّ أَسْلَمْتُ نَفْسِي إِلَيْكَ، وَفَوَّضْتُ أَمْرِي إِلَيْكَ، وَوَجَّهْتُ وَجْهِي إِلَيْكَ، وَأَلْجَأْتُ ظَهْرِي إِلَيْكَ، رَغْبَةً وَرَهْبَةً إِلَيْكَ، لَا مَلْجَأَ وَلَا مَنْجَا مِنْكَ إِلَّا إِلَيْكَ، آمَنْتُ بِكِتَابِكَ الَّذِي أَنْزَلْتَ، وَبِنَبِيِّكَ الَّذِي أَرْسَلْتَ', ref:'متفق عليه — من قالها ومات من ليلته مات على الفطرة', target:1 },
    { id:'sleep9', title:'دعاء الاستيقاظ', text:'الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ', ref:'رواه البخاري', target:1 },
    { id:'sleep10', title:'دعاء الرؤيا', text:'اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، وَمِنْ عَذَابِ جَهَنَّمَ، وَمِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ، وَمِنْ شَرِّ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ', ref:'متفق عليه', target:1 },
    { id:'sleep11', title:'دعاء العافية', text:'اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ', ref:'رواه أبو داود', target:3 },
    { id:'sleep12', title:'دعاء الكفاية', text:'بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ', ref:'رواه أبو داود — من قالها ثلاثاً لم يضره شيء', target:3 },
    { id:'sleep13', title:'دعاء الرضا', text:'رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا', ref:'رواه أبو داود', target:3 },
    { id:'sleep14', title:'دعاء القنوت', text:'اللَّهُمَّ اهْدِنِي فِيمَنْ هَدَيْتَ، وَعَافِنِي فِيمَنْ عَافَيْتَ، وَتَوَلَّنِي فِيمَنْ تَوَلَّيْتَ، وَبَارِكْ لِي فِيمَا أَعْطَيْتَ، وَقِنِي شَرَّ مَا قَضَيْتَ', ref:'رواه الترمذي', target:1 },
    { id:'sleep15', title:'الصلاة على النبي', text:'اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ', ref:'من صلى علي صلاة صلى الله عليه بها عشراً (مسلم)', target:10 },
    { id:'sleep16', title:'دعاء الحفظ من الشيطان', text:'أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ', ref:'من قالها عند نومه لم يقربه الشيطان', target:3 },
    { id:'sleep17', title:'دعاء الهم', text:'اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْبُخْلِ وَالْجُبْنِ، وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ', ref:'رواه البخاري', target:1 },
    { id:'sleep18', title:'دعاء البركة', text:'اللَّهُمَّ بَارِكْ لَنَا فِيمَا رَزَقْتَنَا، وَقِنَا عَذَابَ النَّارِ', ref:'رواه ابن ماجه', target:1 },
    { id:'sleep19', title:'دعاء الثبات', text:'يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ', ref:'رواه النسائي', target:1 },
    { id:'sleep20', title:'دعاء الشكر', text:'اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ', ref:'رواه أبو داود والنسائي', target:1 },
    { id:'sleep21', title:'دعاء العفو', text:'اللَّهُمَّ إِنَّكَ عَفُوٌّ كَرِيمٌ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي', ref:'رواه الترمذي', target:1 },
    { id:'sleep22', title:'دعاء النور', text:'اللَّهُمَّ اجْعَلْ فِي قَلْبِي نُورًا، وَفِي بَصَرِي نُورًا، وَفِي سَمْعِي نُورًا، وَعَنْ يَمِينِي نُورًا، وَعَنْ شِمَالِي نُورًا، وَفَوْقِي نُورًا، وَتَحْتِي نُورًا، وَأَمَامِي نُورًا، وَخَلْفِي نُورًا', ref:'متفق عليه', target:1 },
    { id:'sleep23', title:'دعاء المغفرة', text:'رَبِّ اغْفِرْ لِي وَتُبْ عَلَيَّ، إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ', ref:'رواه أبو داود والترمذي', target:3 },
    { id:'sleep24', title:'دعاء السلامة', text:'اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي', ref:'رواه ابن ماجه', target:1 },
    { id:'sleep25', title:'دعاء اليقين', text:'اللَّهُمَّ إِنِّي أَسْأَلُكَ الْيَقِينَ فِي الْإِيمَانِ، وَالْعَافِيَةَ فِي الْأَبْدَانِ، وَالْأَمَانَةَ فِي الْقُلُوبِ', ref:'رواه الطبراني', target:1 },
  ];

  const KEY = 'zad_counts_sleep_v1';
  function loadC(){ try { return JSON.parse(localStorage.getItem(KEY)||'{}'); } catch { return {}; } }
  function saveC(c){ try { localStorage.setItem(KEY, JSON.stringify(c)); } catch {} }
  const counts = loadC();

  const container = document.getElementById('azkarList');
  if(!container) return;

  AZKAR_SLEEP.forEach(z => {
    const item = document.createElement('div');
    item.className = 'azkar-item';
    item.id = 'dhikr-' + z.id;

    const h3 = document.createElement('h3');
    h3.textContent = z.title;

    const text = document.createElement('div');
    text.className = 'azkar-text';
    text.textContent = z.text;

    const ref = document.createElement('div');
    ref.className = 'azkar-ref';
    ref.textContent = z.ref;

    const actions = document.createElement('div');
    actions.className = 'azkar-actions';

    const bCopy = document.createElement('button');
    bCopy.type='button'; bCopy.textContent='📋 نسخ';
    const bSpeak = document.createElement('button');
    bSpeak.type='button'; bSpeak.textContent='🔊 استماع';
    const bShare = document.createElement('button');
    bShare.type='button'; bShare.textContent='📤 مشاركة';
    const bCount = document.createElement('button');
    bCount.type='button'; bCount.textContent='+ عدّ';
    const badge = document.createElement('span');
    badge.className='count-badge'; badge.textContent = (counts[z.id]||0) + ' / ' + z.target;
    const bReset = document.createElement('button');
    bReset.type='button'; bReset.textContent='إعادة';

    actions.append(bCopy, bSpeak, bShare, bCount, badge, bReset);
    item.append(h3, text, ref, actions);
    container.appendChild(item);

    bCopy.addEventListener('click', async ()=>{ try { await copyText(z.text); showToast('تم النسخ ✓'); } catch { showToast('تعذّر النسخ'); } });
    bSpeak.addEventListener('click', ()=> speak(z.text));
    bShare.addEventListener('click', ()=> shareContent({ title: z.title, text: z.text, url: location.origin + '/azkar-sleep.html#dhikr-' + z.id }));
    bCount.addEventListener('click', ()=>{
      const cur = counts[z.id] || 0;
      if(cur >= z.target) return;
      counts[z.id] = cur + 1; saveC(counts);
      badge.textContent = counts[z.id] + ' / ' + z.target;
      if(counts[z.id] >= z.target){ badge.style.background = 'var(--primary)'; badge.style.color = '#fff'; showToast('اكتمل ✓'); }
    });
    bReset.addEventListener('click', ()=>{
      delete counts[z.id]; saveC(counts);
      badge.textContent = '0 / ' + z.target;
      badge.style.background = 'var(--accent-light)';
      badge.style.color = 'var(--primary)';
    });
  });
})();
</script>
</body>
</html>
