<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07221a">
  <meta name="description" content="استمع إلى القرآن الكريم بأصوات القراء — زاد عبيدة">
  <title>الاستماع للقرآن الكريم — زاد عبيدة</title>
  <link rel="icon" href="./logo-zad-almuslim.webp.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base: #061813;
      --bg-surface: rgba(13, 38, 30, 0.84);
      --bg-glass: rgba(18, 49, 39, 0.72);
      --text-main: #f7faf8;
      --text-muted: #a6c0b5;
      --gold: #e6c274;
      --gold-bright: #ffe094;
      --emerald: #0e7a5d;
      --border-gold: rgba(230, 194, 116, 0.28);
    }

    body.light-mode {
      --bg-base: #f5f7f2;
      --bg-surface: rgba(255, 255, 255, 0.92);
      --bg-glass: rgba(255, 255, 255, 0.95);
      --text-main: #122d24;
      --text-muted: #526b61;
      --gold: #b88928;
      --gold-bright: #d4a33b;
      --emerald: #0b6b50;
      --border-gold: rgba(11, 107, 80, 0.18);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Tajawal', sans-serif;
      color: var(--text-main);
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 15% 10%, rgba(14, 122, 93, 0.42), transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(230, 194, 116, 0.22), transparent 48%),
        radial-gradient(circle at 50% 45%, rgba(9, 55, 42, 0.35), transparent 75%);
      overflow-x: hidden;
      padding-bottom: 120px;
      position: relative;
    }

    /* زخارف هندسية إسلامية في الخلفية */
    .islamic-pattern {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.075;
      background-image: url("data:image/svg+xml,%3Csvg width='84' height='84' viewBox='0 0 84 84' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23e6c274' stroke-width='1.2'%3E%3Cpath d='M42 4L80 42L42 80L4 42Z'/%3E%3Cpath d='M68.8 15.2L68.8 68.8L15.2 68.8L15.2 15.2Z'/%3E%3Ccircle cx='42' cy='42' r='15'/%3E%3Ccircle cx='42' cy='42' r='38'/%3E%3C/g%3E%3C/svg%3E");
      background-size: 92px 92px;
    }

    /* =========================================================
       الشريط العلوي: الشعار + زاد عبيدة فقط + شريط المزايا
       ========================================================= */
    .main-header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      background: rgba(6, 24, 19, 0.88);
      border-bottom: 1px solid var(--border-gold);
    }
    body.light-mode .main-header {
      background: rgba(255, 255, 255, 0.9);
    }

    .header-top {
      max-width: 1320px;
      margin: 0 auto;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-only {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-main);
    }
    .brand-only img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      box-shadow: 0 0 14px rgba(230, 194, 116, 0.35);
    }
    .brand-only span {
      font: 700 1.45rem/1 'Amiri', serif;
      color: var(--gold-bright);
      letter-spacing: 0.01em;
    }
    body.light-mode .brand-only span {
      color: #0b6b50;
    }

    /* شريط الوصول السريع لباقي المزايا والصفحات */
    .features-nav {
      max-width: 1320px;
      margin: 0 auto;
      padding: 0 18px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .features-nav::-webkit-scrollbar { display: none; }

    .feat-link {
      text-decoration: none;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-gold);
      padding: 6px 14px;
      border-radius: 99px;
      font: 700 0.84rem 'Tajawal', sans-serif;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    body.light-mode .feat-link {
      background: rgba(11, 107, 80, 0.06);
    }
    .feat-link:hover, .feat-link.active {
      background: linear-gradient(135deg, var(--gold), #c89d42);
      color: #071e17;
      border-color: var(--gold);
      box-shadow: 0 4px 12px rgba(230, 194, 116, 0.25);
    }

    .theme-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-gold);
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 1.05rem;
      flex-shrink: 0;
    }

    /* =========================================================
       التخطيط المتجاوب للهاتف والحاسوب
       ========================================================= */
    .app-container {
      position: relative;
      z-index: 2;
      max-width: 1320px;
      margin: 0 auto;
      padding: 16px 18px;
    }

    @media (min-width: 960px) {
      .app-container {
        display: grid;
        grid-template-columns: 1.45fr 0.95fr;
        gap: 26px;
        align-items: start;
      }
      .crates-section { display: block !important; }
      .wheel-section {
        display: flex !important;
        position: sticky;
        top: 108px;
        height: calc(100vh - 230px);
        min-height: 530px;
      }
      .mobile-back-btn { display: none !important; }

      .crates-grid {
        display: grid !important;
        grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
        gap: 18px;
        overflow: visible !important;
        padding: 6px 0 !important;
      }
      .reciter-card {
        min-width: 0 !important;
        max-width: none !important;
        height: 335px !important;
      }
    }

    /* =========================================================
       قسم القرّاء (Crates Section)
       ========================================================= */
    .crates-section.hide-on-mobile {
      display: none;
    }

    .section-intro {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .section-intro h1 {
      margin: 0;
      font: 700 clamp(1.7rem, 3.5vw, 2.3rem)/1.2 'Amiri', serif;
      color: var(--gold-bright);
    }
    body.light-mode .section-intro h1 { color: #0b6b50; }
    .section-intro p {
      margin: 2px 0 0;
      color: var(--text-muted);
      font-size: 0.92rem;
    }

    .filter-tabs {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }
    .filter-tab {
      background: var(--bg-surface);
      border: 1px solid var(--border-gold);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 99px;
      font: 700 0.82rem 'Tajawal', sans-serif;
      cursor: pointer;
    }
    .filter-tab.active {
      background: var(--emerald);
      border-color: var(--gold);
      color: #fff;
    }

    .search-input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border-gold);
      border-radius: 16px;
      padding: 11px 16px;
      margin-bottom: 18px;
    }
    .search-input-wrap input {
      flex: 1;
      background: transparent;
      border: 0;
      color: var(--text-main);
      font: 600 0.95rem 'Tajawal', sans-serif;
      outline: none;
    }

    /* حاوية بطاقات القرّاء في الهاتف (سحب أفقي سلس) */
    .crates-grid {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 8px 6px 22px;
      scrollbar-width: none;
    }
    .crates-grid::-webkit-scrollbar { display: none; }

    /* بطاقة القارئ المزخرفة */
    .reciter-card {
      min-width: 270px;
      max-width: 300px;
      height: 375px;
      scroll-snap-align: center;
      border-radius: 28px;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      cursor: pointer;
      user-select: none;
      overflow: hidden;
      border: 1px solid rgba(230, 194, 116, 0.32);
      box-shadow: 0 20px 42px rgba(0, 0, 0, 0.38);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s ease;
    }

    .reciter-card::after {
      content: '۞';
      position: absolute;
      bottom: -26px;
      left: -16px;
      font: 140px/1 'Amiri', serif;
      opacity: 0.08;
      pointer-events: none;
    }

    /* تدرجات ألوان البطاقات الفخمة */
    .reciter-card[data-style="0"] { background: linear-gradient(155deg, #0f6e53, #07382a); color: #fff; }
    .reciter-card[data-style="1"] { background: linear-gradient(155deg, #b85665, #6f2b36); color: #fff; }
    .reciter-card[data-style="2"] { background: linear-gradient(155deg, #6b4e71, #3b2640); color: #fff; }
    .reciter-card[data-style="3"] { background: linear-gradient(155deg, #9c742b, #5c4111); color: #fff; }

    .reciter-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 26px 50px rgba(0, 0, 0, 0.48);
    }
    .reciter-card.is-selected {
      outline: 3px solid var(--gold-bright);
      outline-offset: 3px;
    }

    .card-top-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      font-weight: 700;
      z-index: 2;
    }
    .surah-count-pill {
      background: rgba(0, 0, 0, 0.25);
      padding: 4px 11px;
      border-radius: 99px;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }
    .fav-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 0;
      background: rgba(0, 0, 0, 0.25);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .fav-btn.active { color: #ffd166; }

    /* =========================================================
       صورة القارئ الدوّارة داخل إطار ذهبي متوهج
       ========================================================= */
    .gold-spinning-frame {
      width: 136px;
      height: 136px;
      margin: 6px auto;
      border-radius: 50%;
      padding: 5px;
      background: conic-gradient(from 0deg, #e6c274, #fff0bd, #b88928, #e6c274);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5), 0 0 22px rgba(230, 194, 116, 0.35);
      display: grid;
      place-items: center;
      position: relative;
      z-index: 2;
    }

    .spinning-photo-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      background: radial-gradient(circle at 30% 30%, #1d5c49, #09241c);
      border: 2px solid #09221a;
      display: grid;
      place-items: center;
      animation: photoSpin 18s linear infinite;
    }

    .reciter-card:hover .spinning-photo-inner {
      animation-duration: 7s; /* تدور أسرع عند اللمس */
    }

    .spinning-photo-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* الشعار الفني المزخرف للقراء الذين ليس لديهم صورة فوتوغرافية */
    .artistic-monogram {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, #184e3e 0%, #09221b 100%);
      color: var(--gold-bright);
      text-align: center;
      padding: 8px;
    }
    .artistic-monogram span {
      font: 700 1.9rem/1 'Amiri', serif;
    }
    .artistic-monogram small {
      font: 700 0.62rem/1.2 'Tajawal', sans-serif;
      color: #d8ece3;
      margin-top: 3px;
    }

    @keyframes photoSpin {
      100% { transform: rotate(360deg); }
    }

    .card-reciter-title {
      text-align: center;
      font: 800 1.25rem/1.35 'Tajawal', sans-serif;
      margin: 4px 0 0;
      z-index: 2;
    }

    .card-bottom-info {
      text-align: center;
      z-index: 2;
    }
    .card-rewaya-text {
      font-size: 0.82rem;
      opacity: 0.88;
      margin: 0 0 10px;
    }
    .open-list-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.92);
      color: #0b261e;
      padding: 7px 18px;
      border-radius: 99px;
      font: 800 0.82rem 'Tajawal', sans-serif;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }

    /* =========================================================
       شاشة العجلة الدائرية للسور مع صورة القارئ في الخلفية!
       ========================================================= */
    .wheel-section {
      display: none;
      flex-direction: column;
      height: calc(100vh - 185px);
      min-height: 490px;
      background: var(--bg-surface);
      border: 1px solid var(--border-gold);
      border-radius: 30px;
      padding: 18px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 24px 54px rgba(0, 0, 0, 0.45);
    }

    .wheel-section.show-on-mobile {
      display: flex;
    }

    /* صورة القارئ الشفافة في خلفية شاشة التشغيل */
    .wheel-bg-portrait {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center top;
      opacity: 0.16;
      filter: blur(2px) saturate(1.1);
      pointer-events: none;
      z-index: 0;
      transition: background-image 0.5s ease, opacity 0.5s ease;
    }
    body.light-mode .wheel-bg-portrait {
      opacity: 0.12;
    }

    /* طبقة تدرج فوق صورة الخلفية لضمان وضوح القراءة 100% */
    .wheel-bg-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 15%, var(--bg-base) 92%);
      opacity: 0.78;
      pointer-events: none;
      z-index: 0;
    }

    .wheel-top-bar {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-gold);
    }

    .wheel-reciter-info {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .mobile-back-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border-gold);
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    body.light-mode .mobile-back-btn {
      background: rgba(11, 107, 80, 0.1);
      color: #0b6b50;
    }

    .wheel-mini-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2.5px solid var(--gold);
      overflow: hidden;
      background: #103b2e;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      font: 700 1.25rem 'Amiri', serif;
      color: var(--gold);
    }
    .wheel-mini-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .surah-search-box {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-gold);
      color: var(--text-main);
      border-radius: 12px;
      padding: 7px 12px;
      width: 130px;
      font: 600 0.82rem 'Tajawal', sans-serif;
      outline: none;
    }
    body.light-mode .surah-search-box {
      background: rgba(255, 255, 255, 0.8);
    }

    /* حاوية القائمة المقوّسة */
    .wheel-scroll-area {
      flex: 1;
      position: relative;
      z-index: 2;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      padding: 170px 4px;
      scrollbar-width: none;
      mask-image: linear-gradient(to bottom, transparent 0%, black 16%, black 84%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 16%, black 84%, transparent 100%);
    }
    .wheel-scroll-area::-webkit-scrollbar { display: none; }

    .surah-wheel-row {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      scroll-snap-align: center;
      padding: 0 12px;
      border-radius: 18px;
      cursor: pointer;
      will-change: transform, opacity;
      transition: background 0.2s;
    }
    .surah-wheel-row:hover {
      background: rgba(230, 194, 116, 0.12);
    }

    .surah-row-main {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .surah-num-badge {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #17664e, #0a2b21);
      border: 2px solid var(--gold);
      color: var(--gold-bright);
      font: 800 0.85rem 'Tajawal', sans-serif;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .surah-wheel-row.playing .surah-num-badge {
      animation: photoSpin 6s linear infinite;
      background: var(--gold);
      color: #082019;
    }

    .play-pill-btn {
      background: linear-gradient(135deg, var(--gold-bright), var(--gold));
      color: #082019;
      border: 0;
      padding: 7px 17px;
      border-radius: 99px;
      font: 800 0.82rem 'Tajawal', sans-serif;
      opacity: 0;
      transform: scale(0.75);
      pointer-events: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      flex-shrink: 0;
    }

    .surah-wheel-row.is-center .play-pill-btn {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    /* =========================================================
       المشغل السفلي العائم (مع دعم التشغيل في الخلفية)
       ========================================================= */
    .floating-player {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 840px;
      background: rgba(9, 32, 25, 0.95);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border-gold);
      border-radius: 22px;
      padding: 10px 16px;
      z-index: 100;
      color: #fff;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
    }

    .player-row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .player-track-details {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .player-thumb {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      overflow: hidden;
      background: #144436;
      display: grid;
      place-items: center;
      font: 700 1.2rem 'Amiri', serif;
      color: var(--gold);
      flex-shrink: 0;
    }
    .player-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .player-thumb.spinning {
      animation: photoSpin 12s linear infinite;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .player-controls button {
      background: rgba(255, 255, 255, 0.1);
      border: 0;
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s;
    }
    .player-controls button#qaPlay {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--gold-bright), var(--gold));
      color: #082019;
      font-size: 1.15rem;
    }

    .player-seek-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
      font-size: 0.72rem;
      color: #b7cfc5;
    }
    .player-seek-row input {
      flex: 1;
      height: 4px;
      accent-color: var(--gold);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="islamic-pattern" aria-hidden="true"></div>

  <!-- الشريط العلوي: الشعار + زاد عبيدة فقط + شريط الوصول للمزايا -->
  <header class="main-header">
    <div class="header-top">
      <a href="./index.html" class="brand-only">
        <img src="./logo-zad-almuslim.webp.png" alt="شعار زاد عبيدة">
        <span>زاد عبيدة</span>
      </a>

      <button class="theme-btn" id="themeToggleBtn" type="button" title="تبديل المظهر">☀️</button>
    </div>

    <!-- شريط المزايا للوصول السريع لباقي الصفحات -->
    <nav class="features-nav" aria-label="أبواب ومزايا الموقع">

<script>
(() => {
  const SURAH_NAMES = [
    "الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس",
    "هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه",
    "الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم",
    "لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر",
    "فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق",
    "الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة",
    "الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج",
    "نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس",
    "التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد",
    "الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات",
    "القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر",
    "المسد","الإخلاص","الفلق","الناس"
  ];

  // قاموس صور شامل لأشهر القرّاء في العالم الإسلامي
  const RECITER_PHOTOS = [
    { keys: ["العفاسي", "مشاري"], url: "https://static.qurancdn.com/images/reciters/6/mishary-rashid-alafasy-profile.jpeg" },

    { keys: ["الدوسري"], url: "https://static.qurancdn.com/images/reciters/11/yasser-ad-dussary-profile.jpeg" },
    { keys: ["القطامي"], url: "https://static.qurancdn.com/images/reciters/12/nasser-al-qatami-profile.jpeg" },
    { keys: ["العجمي"], url: "https://i1.sndcdn.com/artworks-000105396336-62598a-t500x500.jpg" },
    { keys: ["فارس عباد"], url: "https://i1.sndcdn.com/artworks-000083654454-7w9p7m-t500x500.jpg" },
    { keys: ["إدريس أبكر", "ادريس ابكر"], url: "https://i1.sndcdn.com/artworks-000116448935-5v5b6p-t500x500.jpg" },
    { keys: ["بندر بليلة"], url: "https://i1.sndcdn.com/artworks-000237502987-7u8f9j-t500x500.jpg" },
    { keys: ["عبدالله الجهني", "الجهني"], url: "https://i1.sndcdn.com/artworks-000095674321-8x9y2z-t500x500.jpg" },
    { keys: ["محمد أيوب", "محمد ايوب"], url: "https://i1.sndcdn.com/artworks-000161448392-3k4l5m-t500x500.jpg" },
    { keys: ["علي جابر"], url: "https://i1.sndcdn.com/artworks-000142556789-9p0q1r-t500x500.jpg" },
    { keys: ["خالد الجليل"], url: "https://i1.sndcdn.com/artworks-000198765432-2s3t4u-t500x500.jpg" },
    { keys: ["هزاع البلوشي"], url: "https://i1.sndcdn.com/artworks-000245678901-5v6w7x-t500x500.jpg" },
    { keys: ["إسلام صبحي", "اسلام صبحي"], url: "https://i1.sndcdn.com/artworks-000512345678-8y9z0a-t500x500.jpg" },
    { keys: ["وديع اليمني"], url: "https://i1.sndcdn.com/artworks-000312345678-1b2c3d-t500x500.jpg" },
    { keys: ["رعد الكردي"], url: "https://i1.sndcdn.com/artworks-000412345678-4e5f6g-t500x500.jpg" }
  ];

  // توليد أيقونة فنية مذهّبة مزخرفة لأي قارئ لا تتوفر له صورة خارجية
  function generateIslamicAvatarDataUrl(name) {
    const clean = name.replace(/^الشيخ\s+/, '').trim();
    const parts = clean.split(/\s+/);
    const shortName = parts.length > 1 ? `${parts[0]} ${parts[parts.length - 1]}` : clean;
    const initial = clean.replace(/^ال/, '').charAt(0) || '۞';

    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
      <defs>
        <radialGradient id="g" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#1c6852"/>
          <stop offset="100%" stop-color="#07221a"/>
        </radialGradient>
      </defs>
      <rect width="240" height="240" fill="url(#g)"/>
      <g fill="none" stroke="#e6c274" stroke-opacity="0.25" stroke-width="2">
        <polygon points="120,18 222,120 120,222 18,120"/>
        <rect x="48" y="48" width="144" height="144"/>
        <circle cx="120" cy="120" r="88"/>
      </g>
      <text x="120" y="128" text-anchor="middle" fill="#ffe094" font-family="Amiri, serif" font-size="68" font-weight="bold">${initial}</text>
      <text x="120" y="168" text-anchor="middle" fill="#e8f3ee" font-family="Tajawal, sans-serif" font-size="16" font-weight="bold">${shortName.slice(0, 18)}</text>
    </svg>`;
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  function findReciterPhoto(name) {
    for (const entry of RECITER_PHOTOS) {
      if (entry.keys.some(k => name.includes(k))) {
        return entry.url;
      }
    }
    return generateIslamicAvatarDataUrl(name);
  }

  let allReciters = [];
  let filteredReciters = [];
  let favorites = [];
  try { favorites = JSON.parse(localStorage.getItem('zad_fav_reciters') || '[]'); } catch (e) {}

  let currentFilter = 'all';
  let activeReciter = null;
  let activeSurahs = [];
  let currentTrackIndex = -1;

  const cratesSection = document.getElementById('cratesSection');
  const wheelSection = document.getElementById('wheelSection');
  const cratesGrid = document.getElementById('cratesGrid');
  const wheelScrollArea = document.getElementById('wheelScrollArea');
  const reciterSearchInput = document.getElementById('reciterSearchInput');
  const surahSearchInput = document.getElementById('surahSearchInput');
  const audio = document.getElementById('qaAudio');
  const playBtn = document.getElementById('qaPlay');
  const playerThumb = document.getElementById('playerThumb');

  // تبديل الوضع الليلي / النهاري
  const themeBtn = document.getElementById('themeToggleBtn');
  themeBtn.addEventListener('click', () => {
    document.body.classList.toggle('light-mode');
    themeBtn.textContent = document.body.classList.contains('light-mode') ? '🌙' : '☀️';
  });

  // 1. تحميل جميع القرّاء من MP3Quran
  async function loadAllReciters() {
    try {
      const res = await fetch('https://www.mp3quran.net/api/v3/reciters?language=ar');
      const data = await res.json();
      allReciters = (data.reciters || []).map(r => {
        const m = r.moshaf && r.moshaf[0] ? r.moshaf[0] : null;
        const photoUrl = findReciterPhoto(r.name);
        const hasRealPhoto = !photoUrl.startsWith('data:image');
        return {
          id: r.id,
          name: r.name,
          photo: photoUrl,
          fallbackSvg: generateIslamicAvatarDataUrl(r.name),
          hasRealPhoto,
          rewaya: m ? m.name : 'حفص عن عاصم',
          server: m ? m.server : '',
          surahTotal: m ? m.surah_total : 0,
          surahList: m && m.surah_list ? m.surah_list.split(',').map(Number) : []
        };
      }).filter(r => r.server && r.surahList.length > 0);

      // إظهار القرّاء ذوي الصور الحقيقية أولاً ثم البقية
      allReciters.sort((a, b) => (b.hasRealPhoto ? 1 : 0) - (a.hasRealPhoto ? 1 : 0));

      filterReciters();

      if (window.innerWidth >= 960 && allReciters.length > 0) {
        selectReciter(allReciters[0], false);
      }
    } catch (err) {
      cratesGrid.innerHTML = `<div style="padding:40px;text-align:center;width:100%;">تعذّر تحميل القرّاء. تحقق من اتصال الإنترنت.</div>`;
    }
  }

  function filterReciters() {
    const q = reciterSearchInput.value.trim();
    filteredReciters = allReciters.filter(r => {
      if (currentFilter === 'complete' && r.surahTotal < 114) return false;
      if (currentFilter === 'favorites' && !favorites.includes(r.id)) return false;
      if (q && !r.name.includes(q) && !r.rewaya.includes(q)) return false;
      return true;
    });
    renderReciterCards();
  }

  // 2. عرض بطاقات القرّاء مع صورهم الدوّارة داخل الإطار الذهبي
  function renderReciterCards() {
    if (!filteredReciters.length) {
      cratesGrid.innerHTML = `<div style="padding:40px;text-align:center;width:100%;color:var(--text-muted);">لا توجد نتائج مطابقة لبحثك.</div>`;
      return;
    }

    const list = filteredReciters.slice(0, 90);
    cratesGrid.innerHTML = list.map((r, i) => {
      const isFav = favorites.includes(r.id);
      const isSelected = activeReciter && activeReciter.id === r.id;

      return `
        <article class="reciter-card ${isSelected ? 'is-selected' : ''}" data-style="${i % 4}" data-id="${r.id}">
          <div class="card-top-meta">
            <span class="surah-count-pill">${r.surahTotal} سورة</span>
            <button class="fav-btn ${isFav ? 'active' : ''}" data-fav="${r.id}" type="button" title="إضافة للمفضلة">
              ${isFav ? '★' : '☆'}
            </button>
          </div>

          <div class="gold-spinning-frame">
            <div class="spinning-photo-inner">
              <img src="${r.photo}" alt="${r.name}" loading="lazy" onerror="this.onerror=null;this.src='${r.fallbackSvg}';">
            </div>
          </div>

          <h2 class="card-reciter-title">${r.name}</h2>

          <div class="card-bottom-info">
            <p class="card-rewaya-text">${r.rewaya}</p>
            <span class="open-list-badge">استمع للتلاوات ←</span>
          </div>
        </article>
      `;
    }).join('');
  }

  cratesGrid.addEventListener('click', (e) => {
    const favBtn = e.target.closest('[data-fav]');
    if (favBtn) {
      e.stopPropagation();
      const id = Number(favBtn.dataset.fav);
      favorites = favorites.includes(id) ? favorites.filter(x => x !== id) : [...favorites, id];
      localStorage.setItem('zad_fav_reciters', JSON.stringify(favorites));
      filterReciters();
      return;
    }

    const card = e.target.closest('.reciter-card');
    if (!card) return;
    const id = Number(card.dataset.id);
    const reciter = allReciters.find(r => r.id === id);
    if (reciter) selectReciter(reciter, true);
  });

  // 3. عند اختيار القارئ: وضع صورته في خلفية شاشة التشغيل وفتح قائمة السور
  function selectReciter(reciter, switchOnMobile) {
    activeReciter = reciter;

    cratesGrid.querySelectorAll('.reciter-card').forEach(c => {
      c.classList.toggle('is-selected', Number(c.dataset.id) === reciter.id);
    });

    document.getElementById('wheelReciterName').textContent = reciter.name;
    document.getElementById('wheelReciterSub').textContent = `${reciter.surahTotal} سورة · ${reciter.rewaya}`;

    // وضع صورة القارئ كخلفية شفافة لشاشة التشغيل
    const bgEl = document.getElementById('wheelBgPortrait');
    bgEl.style.backgroundImage = `url("${reciter.photo}")`;

    // وضع صورة القارئ في الترويسة الصغيرة
    const miniAv = document.getElementById('wheelMiniAvatar');
    miniAv.innerHTML = `<img src="${reciter.photo}" alt="${reciter.name}" onerror="this.onerror=null;this.src='${reciter.fallbackSvg}';">`;

    surahSearchInput.value = '';
    renderWheelSurahs('');

    if (switchOnMobile && window.innerWidth < 960) {
      cratesSection.classList.add('hide-on-mobile');
      wheelSection.classList.add('show-on-mobile');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  document.getElementById('mobileBackBtn').addEventListener('click', () => {
    wheelSection.classList.remove('show-on-mobile');
    cratesSection.classList.remove('hide-on-mobile');
  });

  function renderWheelSurahs(query) {
    if (!activeReciter) return;
    activeSurahs = activeReciter.surahList.map(num => ({
      number: num,
      name: SURAH_NAMES[num - 1] || `سورة ${num}`,
      url: `${activeReciter.server}${String(num).padStart(3, '0')}.mp3`
    })).filter(s => !query || s.name.includes(query) || String(s.number) === query);

    wheelScrollArea.innerHTML = activeSurahs.map((s, idx) => `
      <div class="surah-wheel-row" data-idx="${idx}">
        <div class="surah-row-main">
          <div class="surah-num-badge">${s.number}</div>
          <div style="min-width:0;">
            <div style="font-weight:800;font-size:1.05rem;">سورة ${s.name}</div>
            <div style="font-size:0.78rem;color:var(--text-muted);">${activeReciter.name}</div>
          </div>
        </div>
        <button class="play-pill-btn" type="button">▶ تشغيل</button>
      </div>
    `).join('');

    wheelScrollArea.scrollTop = 0;
    requestAnimationFrame(updateWheelArc);
  }

  function updateWheelArc() {
    const rect = wheelScrollArea.getBoundingClientRect();
    if (!rect.height) return;
    const centerY = rect.top + rect.height / 2;
    const radius = rect.height * 0.52;
    const rows = wheelScrollArea.querySelectorAll('.surah-wheel-row');

    rows.forEach(row => {
      const r = row.getBoundingClientRect();
      const rowCenter = r.top + r.height / 2;
      const norm = Math.max(-1, Math.min(1, (rowCenter - centerY) / radius));
      const absNorm = Math.abs(norm);

      const arcX = (1 - Math.cos(norm * (Math.PI / 2.3))) * 50;
      const scale = 1 - absNorm * 0.2;
      const opacity = 1 - Math.pow(absNorm, 1.4) * 0.65;

      row.style.transform = `translateX(${arcX}px) scale(${scale})`;
      row.style.opacity = Math.max(0.2, opacity);

      if (absNorm < 0.14) {
        row.classList.add('is-center');
      } else {
        row.classList.remove('is-center');
      }
    });
  }

  wheelScrollArea.addEventListener('scroll', () => requestAnimationFrame(updateWheelArc));
  window.addEventListener('resize', () => requestAnimationFrame(updateWheelArc));

  wheelScrollArea.addEventListener('click', (e) => {
    const row = e.target.closest('.surah-wheel-row');
    if (!row) return;
    const idx = Number(row.dataset.idx);
    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    playSurahAtIndex(idx);
  });

  // 4. تشغيل الصوت + تفعيل خاصية التشغيل في الخلفية (MediaSession API)
  function updateMediaSession(track, reciter) {
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: `سورة ${track.name}`,
        artist: reciter.name,
        album: 'زاد عبيدة · المكتبة القرآنية',
        artwork: [
          { src: reciter.photo, sizes: '256x256', type: 'image/jpeg' },
          { src: './logo-zad-almuslim.webp.png', sizes: '512x512', type: 'image/png' }
        ]
      });

      navigator.mediaSession.setActionHandler('play', () => {
        audio.play();
        playBtn.textContent = '⏸';
        playerThumb.classList.add('spinning');
      });
      navigator.mediaSession.setActionHandler('pause', () => {
        audio.pause();
        playBtn.textContent = '▶';
        playerThumb.classList.remove('spinning');
      });
      navigator.mediaSession.setActionHandler('previoustrack', () => {
        if (currentTrackIndex - 1 >= 0) playSurahAtIndex(currentTrackIndex - 1);
      });
      navigator.mediaSession.setActionHandler('nexttrack', () => {
        if (currentTrackIndex + 1 < activeSurahs.length) playSurahAtIndex(currentTrackIndex + 1);
      });
    }
  }

  function playSurahAtIndex(idx) {
    if (idx < 0 || idx >= activeSurahs.length || !activeReciter) return;
    currentTrackIndex = idx;
    const track = activeSurahs[idx];

    document.getElementById('qaNowTitle').textContent = `سورة ${track.name}`;
    document.getElementById('qaNowSub').textContent = `${activeReciter.name} · ${activeReciter.rewaya}`;

    playerThumb.innerHTML = `<img src="${activeReciter.photo}" alt="${activeReciter.name}" onerror="this.onerror=null;this.src='${activeReciter.fallbackSvg}';">`;

    audio.src = track.url;
    audio.play().then(() => {
      playBtn.textContent = '⏸';
      playerThumb.classList.add('spinning');
      updateMediaSession(track, activeReciter);
    }).catch(() => {});

    wheelScrollArea.querySelectorAll('.surah-wheel-row').forEach((el, i) => {
      el.classList.toggle('playing', i === idx);
    });
  }

  playBtn.addEventListener('click', () => {
    if (!audio.src) return;
    if (audio.paused) {
      audio.play();
      playBtn.textContent = '⏸';
      playerThumb.classList.add('spinning');
    } else {
      audio.pause();
      playBtn.textContent = '▶';
      playerThumb.classList.remove('spinning');
    }
  });

  document.getElementById('qaNext').addEventListener('click', () => {
    if (currentTrackIndex + 1 < activeSurahs.length) playSurahAtIndex(currentTrackIndex + 1);
  });
  document.getElementById('qaPrev').addEventListener('click', () => {
    if (currentTrackIndex - 1 >= 0) playSurahAtIndex(currentTrackIndex - 1);
  });

  audio.addEventListener('ended', () => {
    if (currentTrackIndex + 1 < activeSurahs.length) {
      playSurahAtIndex(currentTrackIndex + 1);
    } else {
      playBtn.textContent = '▶';
      playerThumb.classList.remove('spinning');
    }
  });

  const seekBar = document.getElementById('qaSeek');
  const curTime = document.getElementById('qaCurrentTime');
  const durTime = document.getElementById('qaDuration');

  function fmtTime(s) {
    if (!isFinite(s)) return '0:00';
    return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  }

  audio.addEventListener('timeupdate', () => {
    curTime.textContent = fmtTime(audio.currentTime);
    durTime.textContent = fmtTime(audio.duration);
    if (audio.duration) seekBar.value = Math.floor((audio.currentTime / audio.duration) * 1000);
  });

  seekBar.addEventListener('input', () => {
    if (audio.duration) audio.currentTime = (seekBar.value / 1000) * audio.duration;
  });

  reciterSearchInput.addEventListener('input', filterReciters);
  surahSearchInput.addEventListener('input', (e) => renderWheelSurahs(e.target.value.trim()));

  document.getElementById('filterTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-filter]');
    if (!btn) return;
    document.querySelectorAll('#filterTabs [data-filter]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    filterReciters();
  });

  loadAllReciters();
})();
</script>
</body>
</html>
