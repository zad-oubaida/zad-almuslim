<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d7a5f">
  <meta name="description" content="صحيح البخاري وصحيح مسلم — زاد عبيدة">
  <title>الصحيحان — زاد عبيدة</title>
  <link rel="icon" type="image/png" href="./logo-zad-almuslim.webp.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/style.css">
  <style>
    .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 30px; justify-content: center; flex-wrap: wrap; }
    .tab { padding: 12px 24px; border-radius: 50px; border: 2px solid var(--primary); background: transparent; color: var(--primary); cursor: pointer; font-weight: bold; font-family: inherit; font-size: 1rem; transition: 0.3s; }
    .tab.active { background: var(--primary); color: #fff; }
    .search-box { margin-bottom: 25px; }
    .search-box input { width: 100%; padding: 14px 20px; border: 2px solid var(--border-color); border-radius: 50px; font-size: 1rem; font-family: inherit; outline: none; box-sizing: border-box; }
    .search-box input:focus { border-color: var(--primary); }
    .hadith-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .hadith-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; }
    .hadith-card:hover { transform: translateY(-3px); border-color: var(--primary); box-shadow: 0 8px 25px rgba(13,122,95,0.1); }
    .hadith-card .pill { display: inline-block; background: var(--primary); color: #fff; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; margin-bottom: 10px; width: fit-content; }
    .hadith-card h3 { color: var(--primary); margin: 0 0 10px; font-size: 1rem; }
    .hadith-preview { color: var(--text-color); font-size: 0.9rem; line-height: 1.8; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; flex-grow: 1; }
    .hadith-card .open-btn { margin-top: 15px; padding: 8px 14px; background: var(--primary); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-family: inherit; font-weight: bold; font-size: 0.85rem; }
    .hadith-modal { position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; padding: 20px; }
    .hadith-modal[hidden] { display: none !important; }
    .hadith-dialog { background: var(--card-bg); color: var(--text-color); width: min(800px, 100%); max-height: 88vh; overflow-y: auto; border-radius: 20px; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .hadith-dialog h3 { color: var(--primary); margin-top: 0; border-bottom: 2px solid var(--accent); padding-bottom: 12px; }
    .hadith-full { font-size: 1.15rem; line-height: 2.2; white-space: pre-line; margin: 20px 0; color: var(--text-color); }
    .hadith-close { display: block; width: 100%; margin-top: 20px; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-family: inherit; font-size: 1rem; }
  </style>
</head>

  <div class="tabs">
    <button class="tab active" onclick="switchBook('bukhari', this)">صحيح البخاري</button>

// ============ الوضع الليلي ============
function toggleTheme() {
  document.body.classList.toggle('dark');
  var isDark = document.body.classList.contains('dark');
  document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('zad_theme', isDark ? 'dark' : 'light');
}
if (localStorage.getItem('zad_theme') === 'dark') {
  document.body.classList.add('dark');
  document.getElementById('themeBtn').textContent = '☀️';
}

// ============ المتغيرات ============
let currentBook = 'bukhari';

// ============ التبديل بين الكتابين ============
function switchBook(book, btn) {
  currentBook = book;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('searchInput').value = '';
  renderHadiths();
}

// ============ عرض الأحاديث ============
function renderHadiths() {
  const grid = document.getElementById('hadithGrid');
  grid.innerHTML = '';
  const source = currentBook === 'bukhari' ? SAHIH_BUKHARI : SAHIH_MUSLIM;
  const bookName = currentBook === 'bukhari' ? 'البخاري' : 'مسلم';

  source.forEach((h, i) => {
    const card = document.createElement('div');
    card.className = 'hadith-card';
    card.innerHTML = `
      <span class="pill">${bookName} - ${i + 1}</span>
      <h3>${h.title}</h3>
      <p class="hadith-preview">${h.text}</p>
      <button class="open-btn">اقرأ الحديث كاملاً ←</button>
    `;
    card.querySelector('.open-btn').onclick = (e) => {
      e.stopPropagation();
      openModal(h);
    };
    card.onclick = () => openModal(h);
    grid.appendChild(card);
  });
}

// ============ فتح المودال ============
function openModal(h) {
  document.getElementById('modalTitle').textContent = h.title;
  document.getElementById('modalText').textContent = h.text;
  document.getElementById('hadithModal').hidden = false;
  document.body.style.overflow = 'hidden';
}

// ============ إغلاق المودال ============
function closeModal() {
  document.getElementById('hadithModal').hidden = true;
  document.body.style.overflow = '';
}

document.getElementById('hadithModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});

// ============ البحث ============
function filterHadiths() {
  const query = document.getElementById('searchInput').value.trim();
  const grid = document.getElementById('hadithGrid');
  const source = currentBook === 'bukhari' ? SAHIH_BUKHARI : SAHIH_MUSLIM;
  const cards = grid.querySelectorAll('.hadith-card');
  let visible = 0;

  cards.forEach((card, i) => {
    const match = !query || source[i].title.includes(query) || source[i].text.includes(query);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });

  let noResult = grid.querySelector('.no-result');
  if (visible === 0) {
    if (!noResult) {
      noResult = document.createElement('p');
      noResult.className = 'no-result';
      noResult.style.cssText = 'text-align:center;color:#7f8c8d;grid-column:1/-1;padding:40px;';
      noResult.textContent = 'لا توجد نتائج مطابقة.';
      grid.appendChild(noResult);
    }
  } else if (noResult) {
    noResult.remove();
  }
}

// ============ التحميل الأولي ============
renderHadiths();

</html>
